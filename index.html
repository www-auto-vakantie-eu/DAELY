<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daely Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        :root {
            --daely-primary: #3B82F6;
            --daely-secondary: #8B5CF6;
            --bg-base: #FFFFFF; 
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-base, #09090B);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            top: 0px !important;
        }
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        }
        .goog-te-combo {
            display: none !important;
        }
        .goog-te-gadget {
            display: none !important;
        }
        #goog-gt-tt {
            display: none !important;
        }
        .daely-glow {
            background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.08) 0%, rgba(139, 92, 246, 0.03) 45%, transparent 70%);
        }
        .daely-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
        }
        .accent-gradient {
            background: linear-gradient(135deg, var(--daely-primary) 0%, var(--daely-secondary) 100%);
        }
        .text-gradient {
            background: linear-gradient(135deg, #09090B 0%, #3F3F46 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes daely-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
        .animate-daely {
            animation: daely-pulse 8s ease-in-out infinite;
        }
        .active-scale:active {
            transform: scale(0.96);
            transition: transform 0.1s ease-out;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'nl', includedLanguages: 'nl,en,de,es', autoDisplay: false}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="selection:bg-blue-500/30">
    <div id="google_translate_element" style="display:none;"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
